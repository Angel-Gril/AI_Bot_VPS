name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- 隐私门禁
  secret-scan:
    name: 敏感信息扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks 需要完整历史
      - name: 运行自查脚本
        run: bash scripts/secret-scan.sh
      - name: gitleaks（兜底，覆盖我们规则没写的形态）
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

  # ---------------------------------------------------------------- Shell
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
      - name: 静态检查
        run: shellcheck -S warning sesame/*.sh scripts/*.sh

  # ---------------------------------------------------------------- Python
  python:
    name: Python + 补丁自测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: 语法检查
        run: python3 -m py_compile instabox/patch_retry_after.py tests/test_patch.py
      - name: 补丁自测（打补丁/幂等/dry-run/安全失败）
        run: python3 tests/test_patch.py

  # ---------------------------------------------------------------- 脚本语法
  sh-syntax:
    name: 脚本语法
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: POSIX sh（dash，比 bash 严格，能抓出 `{ ... }` 少分号这类问题）
        run: |
          fail=0
          for f in sesame/*.sh; do
            if sh -n "$f"; then echo "  OK   $f"; else echo "  FAIL $f"; fail=1; fi
          done
          exit $fail
      - name: bash 专用脚本
        run: |
          fail=0
          for f in scripts/*.sh; do
            if bash -n "$f"; then echo "  OK   $f"; else echo "  FAIL $f"; fail=1; fi
          done
          exit $fail
